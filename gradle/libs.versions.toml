[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose-bom = "2025.12.01"
activity-compose = "1.12.2"
lifecycle = "2.9.4"
core-ktx = "1.17.0"
exifinterface = "1.4.1"
documentfile = "1.1.0"
coroutines = "1.10.2"
commons-net = "3.13.0"
android-mail = "1.6.7"
zxing = "3.5.4"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
android-mail = { module = "com.sun.mail:android-mail", version.ref = "android-mail" }
android-activation = { module = "com.sun.mail:android-activation", version.ref = "android-mail" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
