name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # libusb and libuvc, as fetched and patched by scripts/fetch-deps.sh
      - uses: actions/cache@v6
        with:
          path: third_party
          key: third-party-${{ hashFiles('scripts/fetch-deps.sh', 'app/src/main/cpp/patches/**') }}

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v6
        with:
          name: HardLine-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
