name: Release

# Pushing a tag such as v0.2.0 builds the signed APK and attaches it to a draft release.
# The signing key comes from repository secrets; docs/BUILDING.md lists them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches versionName
        id: version
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName = "(.*)"/\1/p' app/build.gradle.kts)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set, so the release cannot be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests and release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK and write its checksum
        working-directory: app/build/outputs/apk/release
        run: |
          mv "HardLine-${{ steps.version.outputs.version }}-release.apk" "HardLine-${{ steps.version.outputs.version }}.apk"
          sha256sum HardLine-*.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Remove the signing key
        if: always()
        run: rm -f release.jks keystore.properties

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/HardLine-*.apk
            app/build/outputs/apk/release/SHA256SUMS
